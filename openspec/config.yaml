schema: spec-driven

context: |
  Academic exam project (Variante 4): offline-first collaborative CASE tool for UML
  class diagramming. Manual/voice/image/XMI input converges to a CanonicalUmlModel;
  generates Spring Boot backend + Next.js frontend + Android (Capacitor) from the model.
  Target stack (per product-04-next-django.md): Django 5.2 LTS + Django Ninja +
  Channels/Daphne backend, Next.js App Router + shadcn/ui + Tailwind + Cytoscape.js +
  Jotai frontend, ONNX Runtime (Qwen3, Moondream) + Vosk local AI, Flutter mobile
  client (explicit instructor requirement, independent of the spec's own
  Capacitor-based Android generation target for generated end-user apps).
  Current repo state: the stack migration/correction is DONE (Django Ninja + Channels
  + Daphne + Argon2 + PyJWT on the backend; Tailwind + shadcn/ui + Cytoscape.js +
  cytoscape-fcose + Jotai on the frontend; pytest + pytest-django + hypothesis and
  Vitest + RTL both installed and passing one smoke test each). What remains is a
  correctly-aligned infra skeleton with ZERO domain logic: no CanonicalUmlModel, no
  canvas, no collaboration, no code generation, no AI/voice/XMI features. Cypress
  (E2E) is not yet bootstrapped. Work proceeds use-case by use-case, grouped into
  cycles, per document section 1 and 38, with a real-state document
  (docs/ai/CURRENT_STATE.md) kept separate from the vision doc.

strict_tdd: true # explicit global CLAUDE.md marker ("Strict TDD Mode: enabled").

testing:
  backend:
    runner: pytest + pytest-django + hypothesis (installed; backend/requirements/test.txt)
    current: one smoke test (backend/config/tests/test_health.py), passing in Docker
  frontend:
    runner: Vitest + React Testing Library (installed; npm test = "vitest run")
    current: one smoke test (button.test.tsx), passing
  e2e:
    runner: Cypress (not yet installed)
    current: none
  coverage:
    available: false
  quality:
    backend_linter: none detected (no ruff/flake8/black config found)
    frontend_linter: eslint (eslint-config-next, flat config eslint.config.mjs)
    frontend_type_checker: typescript (tsconfig.json, strict TS via Next.js template)
    formatter: none detected (no prettier config found)

rules:
  proposal:
    - Derive use cases from product-04-next-django.md; do not invent scope beyond it.
    - Group use cases into small cycles per document section 38 (objective, small use
      cases, acceptance criteria, tests, green build, architecture docs, real-state,
      explicit tech debt).
    - Do not copy use-case identifiers from any other project.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Every UML/model-related requirement must reference the CanonicalUmlModel as the
      single convergence point (manual, voice, image, XMI inputs all normalize to it).
  design:
    - Include sequence diagrams for realtime/collaboration flows (Django Channels).
    - Document architecture decisions with rationale in docs/ai/DECISIONS_LOG.md as well
      as the SDD design artifact (dual documentation is a project convention).
  tasks:
    - Group by cycle, use hierarchical numbering.
    - Keep tasks completable in one session; implement one use case at a time.
    - First task touching an untested area MUST include test-runner setup
      (pytest+pytest-django+hypothesis or Vitest+RTL) as part of that unit, not deferred.
  apply:
    guidelines:
      - Follow existing modular-by-default layout: backend/apps/<feature>/,
        frontend/src/app/, no cross-imports except through the HTTP/WS API contract.
      - Never hardcode URLs, ports, hosts, or credentials — env vars only
        (django-environ backend, NEXT_PUBLIC_* frontend).
      - Update docs/ai/CURRENT_STATE.md and docs/ai/DECISIONS_LOG.md as the real-state
        document required by product-04-next-django.md section 1.
    tdd: true
    test_command: "cd backend && pytest ; cd frontend && npm test"
  verify:
    test_command: "cd backend && pytest ; cd frontend && npm test"
    build_command: "docker compose build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
    - Keep docs/ai/HANDOFF_LATEST.md in sync with the archived change.
