# DEV configuration: every service below builds its "dev" Dockerfile
# target and bind-mounts source for live reload. To run a production-like
# stack instead, change each service's `target:` from `dev` to `prod`,
# drop the source bind mounts (prod images copy the code in at build
# time), and supply production-appropriate env values.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Channels' CHANNEL_LAYERS backend (design.md DD8) — group_send/group_add
  # for the realtime document consumer. Purely additive: nothing calls
  # get_channel_layer() until CHANNEL_LAYERS is configured.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    # Real values come from backend/.env (copy it from backend/env.example
    # — never commit backend/.env).
    env_file: ./backend/.env
    environment:
      # Takes precedence over env_file. The frontend's server-side session
      # check (ssr-protected-routes) now sends requests with
      # `Host: backend:8000` — Django's CommonMiddleware rejects any Host
      # not in ALLOWED_HOSTS, so the Compose service name must be included
      # alongside whatever backend/.env sets for browser-facing access.
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # Running generated backends (apps.backend_deployments): Django only ever
      # calls the runner over this compose network; it never touches Docker.
      RUNNER_URL: ${RUNNER_URL:-http://runner:8090}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8090}
      DEPLOYMENT_MAX_ACTIVE_PER_ORG: ${DEPLOYMENT_MAX_ACTIVE_PER_ORG:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Builds and RUNS the Spring backend generated from a document (one Gradle
  # build container + one Postgres + one JRE container per deployment, on a
  # private network) and reverse-proxies /gen/<deployment-id>/... to it.
  #
  # SECURITY: this is the ONLY service with the Docker socket. Stage 1 mounts the
  # raw socket; stage 2 replaces it with a restricted docker-socket-proxy that only
  # allows the calls runner/app/docker_ops.py makes. The port is published to
  # loopback only (RUNNER_BIND); in the cloud keep it that way and route only
  # `/gen/*` to `runner:8090` from the reverse proxy (Caddy). The management API
  # (/deployments) additionally requires the bearer token and refuses to start
  # without RUNNER_TOKEN. Set RUNNER_TOKEN in the root .env (see runner/env.example).
  runner:
    build:
      context: ./runner
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8090}
      # Optional knobs (unset = the defaults in runner/app/config.py); the image
      # names form the fixed allowlist and can only be changed here, never per request.
      RUNNER_BUILD_IMAGE:
      RUNNER_RUNTIME_IMAGE:
      RUNNER_POSTGRES_IMAGE:
      RUNNER_BUILD_MEM:
      RUNNER_APP_MEM:
      RUNNER_DB_MEM:
      RUNNER_BUILD_CPUS:
      RUNNER_APP_CPUS:
      RUNNER_DB_CPUS:
      RUNNER_MAX_LIFETIME_SECONDS:
      RUNNER_BUILD_TIMEOUT:
      RUNNER_START_TIMEOUT:
      RUNNER_MAX_ZIP_BYTES:
      RUNNER_JPA_DDL_AUTO:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${RUNNER_BIND:-127.0.0.1:8090}:8090"

  # Dev-only SMTP catcher for verification/reset emails (transactional-email
  # spec § "Dev-Only Mailpit Wiring"). Never referenced by any production
  # configuration — the backend only reaches it when backend/.env points
  # EMAIL_HOST/EMAIL_PORT at this service (see backend/env.example).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Real values come from frontend/.env (copy it from
    # frontend/env.local.example — never commit frontend/.env).
    env_file: ./frontend/.env
    environment:
      # Takes precedence over env_file. Inside the frontend container
      # `localhost` is the container itself, so the Next.js server process
      # must reach the API via the Compose service name instead
      # (ssr-protected-routes design.md DD5).
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # --- Generated-project compile gate (generated-project-compile-check) -----
  # Both services below are inert unless `--profile jvm-verify` is given, so
  # plain `docker compose up` and `docker compose exec backend ...` are
  # unaffected. Driven by scripts/verify-generated-project.sh, which resolves
  # GRADLE_IMAGE from apps/spring_generator/emit/versions.py (single source
  # of truth for the Gradle/JDK versions).
  generate-project:
    build:
      context: ./backend
      target: dev
    profiles: [jvm-verify]
    # Skip entrypoint.sh (it waits for Postgres and migrates); the CLI needs
    # neither a database nor backend/.env.
    entrypoint: []
    # The generated tree is root-owned in the named volume; the Gradle
    # container below also runs as root so it can write build/ into it.
    user: root
    volumes:
      # The dev image ships no source (the backend service bind-mounts it too);
      # read-only because the CLI only ever writes under /generated.
      - ./backend:/app:ro
      - generated_project:/generated
    # Literal only: the deleted path is a fixed subdirectory of the volume
    # mountpoint, never interpolated from a variable (DD83, DD84).
    command: ["sh", "-c", "rm -rf /generated/project && python -m apps.generation_runner.cli --target /generated/project"]

  jvm-verify:
    # A required-variable form (`${GRADLE_IMAGE:?}`) would make compose abort
    # every command in this file (even `exec`/`ps`) while GRADLE_IMAGE is
    # unset, so the default is a sentinel that can never be pulled and names
    # the variable in the resulting pull error instead.
    image: ${GRADLE_IMAGE:-gradle.invalid/unset:GRADLE_IMAGE-not-set-run-scripts-verify-generated-project.sh}
    profiles: [jvm-verify]
    user: root
    working_dir: /generated/project
    volumes:
      - generated_project:/generated
    command: ["gradle", "build", "--no-daemon"]
    depends_on:
      generate-project:
        condition: service_completed_successfully

  # --- Generated-project boot smoke (generated-project-boot-smoke) ----------
  # Same profile as the compile gate, so both stay inert under plain `up`.
  # Neither service publishes a port: the JVM is reached over the loopback of
  # its own container. GEN_DB_* defaults are throwaway values that live only
  # here (DD93); override them per run, e.g. `GEN_DB_PASSWORD=wrong bash
  # scripts/verify-generated-project.sh` for the negative case (DD102): the app
  # gets the wrong password while gen-db keeps GEN_DB_SERVER_PASSWORD.
  gen-db:
    image: postgres:16-alpine
    profiles: [jvm-verify]
    environment:
      POSTGRES_DB: ${GEN_DB_NAME:-gensmoke}
      POSTGRES_USER: ${GEN_DB_USER:-gensmoke}
      # Deliberately NOT ${GEN_DB_PASSWORD}: that variable belongs to the app
      # side below, so `GEN_DB_PASSWORD=wrong` creates a real mismatch (DD102).
      POSTGRES_PASSWORD: ${GEN_DB_SERVER_PASSWORD:-gensmoke}
    # Each run starts schemaless, so ddl-auto=create-drop proves the generated DDL.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # No depends_on jvm-verify: the script runs the compile and the smoke as two
  # sequential `run` steps so a Gradle failure keeps its own output (DD94).
  jvm-boot-smoke:
    image: ${GRADLE_IMAGE:-gradle.invalid/unset:GRADLE_IMAGE-not-set-run-scripts-verify-generated-project.sh}
    profiles: [jvm-verify]
    user: root
    working_dir: /generated/project
    volumes:
      - generated_project:/generated
      # Read-only harness; invoked through `bash` so the executable bit is irrelevant (DD96).
      - ./scripts:/scripts:ro
    # The six names application.yml interpolates without defaults.
    environment:
      SPRING_APPLICATION_NAME: generated-backend-smoke
      SPRING_DATASOURCE_URL: jdbc:postgresql://gen-db:5432/${GEN_DB_NAME:-gensmoke}
      SPRING_DATASOURCE_USERNAME: ${GEN_DB_USER:-gensmoke}
      SPRING_DATASOURCE_PASSWORD: ${GEN_DB_PASSWORD:-gensmoke}
      JPA_DDL_AUTO: create-drop
      SERVER_PORT: "8080"
    depends_on:
      gen-db:
        condition: service_healthy
    command: ["bash", "/scripts/boot-smoke.sh"]

  # Converts the OpenAPI export written by jvm-boot-smoke (docs/openapi.json)
  # into a Postman collection + environment (generated-project-postman-collection).
  # Deliberately NO depends_on and NO rm -rf: depending on generate-project
  # would re-run the generator and wipe the export the smoke just wrote (DD113).
  # verify-generated-project.sh runs it as the third sequential step.
  generate-postman:
    build:
      context: ./backend
      target: dev
    profiles: [jvm-verify]
    entrypoint: []
    user: root
    volumes:
      - ./backend:/app:ro
      - generated_project:/generated
    # Literal only, no shell (DD83, DD84, DD113).
    command: ["python", "-m", "apps.postman_export.cli", "--openapi", "/generated/project/docs/openapi.json", "--out-dir", "/generated/project/docs"]

  # Writes docs/domain-manifest.json next to the OpenAPI export and the Postman
  # files (generated-project-domain-manifest). Same shape as generate-postman:
  # NO depends_on and NO rm -rf, so it never re-runs the generator or wipes the
  # volume (DD128). verify-generated-project.sh runs it as the fourth step.
  generate-manifest:
    build:
      context: ./backend
      target: dev
    profiles: [jvm-verify]
    entrypoint: []
    user: root
    volumes:
      - ./backend:/app:ro
      - generated_project:/generated
    # Literal only, no shell (DD83, DD84, DD128).
    command: ["python", "-m", "apps.domain_manifest.cli", "--out-dir", "/generated/project/docs"]

volumes:
  postgres_data:
  generated_project:
