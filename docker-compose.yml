# DEV configuration: every service below builds its "dev" Dockerfile
# target and bind-mounts source for live reload. To run a production-like
# stack instead, change each service's `target:` from `dev` to `prod`,
# drop the source bind mounts (prod images copy the code in at build
# time), and supply production-appropriate env values.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    # Real values come from backend/.env (copy it from backend/env.example
    # — never commit backend/.env).
    env_file: ./backend/.env
    environment:
      # Takes precedence over env_file. The frontend's server-side session
      # check (ssr-protected-routes) now sends requests with
      # `Host: backend:8000` — Django's CommonMiddleware rejects any Host
      # not in ALLOWED_HOSTS, so the Compose service name must be included
      # alongside whatever backend/.env sets for browser-facing access.
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Dev-only SMTP catcher for verification/reset emails (transactional-email
  # spec § "Dev-Only Mailpit Wiring"). Never referenced by any production
  # configuration — the backend only reaches it when backend/.env points
  # EMAIL_HOST/EMAIL_PORT at this service (see backend/env.example).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Real values come from frontend/.env (copy it from
    # frontend/env.local.example — never commit frontend/.env).
    env_file: ./frontend/.env
    environment:
      # Takes precedence over env_file. Inside the frontend container
      # `localhost` is the container itself, so the Next.js server process
      # must reach the API via the Compose service name instead
      # (ssr-protected-routes design.md DD5).
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
